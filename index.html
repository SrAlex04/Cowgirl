<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noche en el rancho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#0b1030;--dusk:#2a1540;--glow:#5a2a3c;--gold:#f4c24d;--sand:#f6e3b4;--ink:#fff6e0;--card:#1b1a45;--saddle:#8a4b2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(var(--night),var(--dusk) 65%,var(--glow));background-color:var(--night);color:var(--ink);font-family:Quicksand,system-ui,sans-serif;font-weight:500;text-align:center;overflow-x:hidden}
.s{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite;pointer-events:none}
@keyframes tw{50%{opacity:.15}}
main{position:relative;max-width:540px;margin:0 auto;padding:36px 18px 60px}
h1,h2{font-family:Rye,Georgia,serif;font-weight:400;color:var(--gold);margin:0 0 10px;line-height:1.2}
h1{font-size:2.1rem}
h2{font-size:1.5rem}
.moon{font-size:3rem;filter:drop-shadow(0 0 14px #f6e3b4)}
.sub{margin:0 0 22px;color:var(--sand);line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stop{background:var(--card);border:2px solid var(--gold);border-radius:14px;color:var(--ink);font:inherit;font-weight:700;padding:18px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:104px}
.stop span{font-size:2rem}
.stop.done{background:#3a2a1c;border-style:solid;border-color:var(--sand)}
.stop.done::after{content:"★ descubierto";font-size:.75rem;color:var(--gold)}
.stop.locked{opacity:.55;border-style:dashed}
.stop:focus-visible,button:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
#prog{margin:18px 0 0;color:var(--sand)}
.dunes{margin-top:30px;font-size:1.8rem;letter-spacing:8px}
.modal{position:fixed;inset:0;background:rgba(4,6,20,.82);overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));z-index:5}
.modal[hidden]{display:none}
.box{position:relative;max-width:500px;margin:0 auto;background:linear-gradient(#241a4d,#1b1a45);border:3px solid var(--gold);border-radius:18px;padding:30px 18px 24px}
#x{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:transparent;color:var(--gold);font-size:1.1rem;cursor:pointer}
.env{background:var(--sand);color:#3a2a1c;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:3.2rem;padding:26px 30px;cursor:pointer;animation:bob 1.8s ease-in-out infinite}
.env small{font-size:.9rem}
@keyframes bob{50%{transform:translateY(-6px)}}
.letter{background:var(--sand);color:#3a2a1c;text-align:left;border-radius:12px;padding:20px;line-height:1.65;animation:open .6s ease}
@keyframes open{from{opacity:0;transform:scale(.9)}}
.sky{position:relative;height:250px;background:radial-gradient(#101a4a,#070a22);border-radius:14px;margin-bottom:14px}
.st{position:absolute;width:44px;height:44px;border:0;background:transparent;font-size:1.8rem;cursor:pointer;transform:translate(-50%,-50%);filter:grayscale(.6) brightness(.9)}
.st.on{filter:drop-shadow(0 0 10px var(--gold));font-size:2.1rem}
#ph,.hint{min-height:64px;color:var(--sand);line-height:1.5;font-size:1.05rem}
.fl{display:block;width:100%;margin:0 0 10px;padding:14px;border:2px solid var(--gold);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.fl b{display:block;color:var(--gold)}
.fl i{display:none;font-style:normal;margin-top:8px;line-height:1.55}
.fl.on i{display:block}
.fl.on{background:#3a2a1c}
.bar{display:flex;justify-content:space-around;margin-bottom:10px;font-weight:700;color:var(--gold)}
#arena{position:relative;height:300px;border:2px dashed var(--gold);border-radius:14px;overflow:hidden;touch-action:manipulation;background:#070a22}
.fs{position:absolute;top:-40px;font-size:36px;cursor:pointer;user-select:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(350px)}}
.go{margin-top:14px;background:var(--gold);color:#3a2a1c;border:0;border-radius:24px;font:inherit;font-weight:700;padding:12px 26px;cursor:pointer}
.pol{background:var(--sand);color:#3a2a1c;border-radius:6px;padding:10px 10px 8px;margin:0 auto 16px;max-width:260px;transform:rotate(-2deg)}
.pol:nth-child(even){transform:rotate(2deg)}
.pol div{height:150px;background:#d9c08a;display:flex;align-items:center;justify-content:center;font-size:2.6rem;border-radius:3px}
.pol p{margin:8px 0 0;font-size:.95rem}
.chest{background:none;border:0;font-size:5rem;cursor:pointer;animation:bob 1.8s ease-in-out infinite}
.msg{line-height:1.65;animation:open .7s ease}
.verse{color:var(--gold);font-style:italic}
main{z-index:1}
h1,.sub{animation:rise 1s ease both}
.sub{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.moon{animation:glow 3.5s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 28px #fff3c4);transform:scale(1.08)}}
.trail{position:relative;height:790px;margin-top:6px}
.trail svg{position:absolute;inset:0;width:100%;height:100%}
.trail path{fill:none;stroke:var(--sand);stroke-width:6;stroke-dasharray:1 16;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.85;animation:walk 1.4s linear infinite}
@keyframes walk{to{stroke-dashoffset:-34}}
.trail .stop{position:absolute;display:block;width:132px;min-height:0;padding:10px 6px 8px;background:#6b3d1f;border:3px solid #3a2010;border-radius:6px;color:var(--sand);font-family:Rye,Georgia,serif;font-size:.8rem;font-weight:400;line-height:1.2;transform:translate(-50%,-50%);transform-origin:50% 0;animation:drop .7s var(--d) ease both,sway 4s ease-in-out 1.8s infinite;box-shadow:0 6px 0 #3a2010}
.trail .stop .ic{display:block;font-size:1.9rem;margin-bottom:2px}
.trail .stop em{font-style:normal}
.trail .stop::before{content:"";position:absolute;left:50%;top:100%;width:8px;height:26px;background:#3a2010;transform:translateX(-50%);z-index:-1}
.trail .stop.done{background:#8a5a1f;border-color:var(--gold)}
.trail .stop.done::after{content:"★";position:absolute;top:-16px;right:-10px;font-size:1.6rem;color:var(--gold);animation:pop .5s ease}
.trail .stop.locked{opacity:.6;border-style:dashed}
@keyframes drop{from{opacity:0;transform:translate(-50%,-120%) scale(.8)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes sway{0%,100%{transform:translate(-50%,-50%) rotate(-2.5deg)}50%{transform:translate(-50%,-50%) rotate(2.5deg)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.box{animation:pop .4s ease}
.rider{position:absolute;font-size:2.2rem;transform:translate(-50%,-50%);transition:left 1.6s ease-in-out,top 1.6s ease-in-out;animation:trot .45s ease-in-out infinite alternate;pointer-events:none;z-index:2}
@keyframes trot{to{margin-top:-6px}}
.cac{position:absolute;font-size:2rem;transform-origin:bottom;animation:cs 3s ease-in-out infinite}
@keyframes cs{50%{transform:rotate(5deg)}}
.mts{position:fixed;left:0;right:0;bottom:0;height:22vh;background:#120a2a;clip-path:polygon(0 100%,0 55%,12% 30%,22% 52%,34% 18%,48% 50%,60% 28%,74% 56%,86% 24%,100% 52%,100% 100%);opacity:.85;pointer-events:none;z-index:0}
.weed{position:fixed;bottom:6px;left:-60px;width:34px;height:34px;border:3px dashed #a8742f;border-radius:50%;animation:roll 14s linear infinite;pointer-events:none;z-index:1}
@keyframes roll{to{transform:translateX(calc(100vw + 120px)) rotate(720deg)}}
.sh{position:fixed;width:90px;height:2px;background:linear-gradient(90deg,transparent,#fff);transform:rotate(25deg);animation:shoot 1.1s ease-out forwards;pointer-events:none;z-index:0}
@keyframes shoot{from{opacity:1;translate:0 0}to{opacity:0;translate:260px 120px}}
.ff{position:fixed;bottom:-10px;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:up 9s linear infinite;pointer-events:none;z-index:0}
@keyframes up{to{transform:translateY(-105vh) translateX(30px);opacity:0}}
.wait h1,.wait .sub,.wait .trail .stop{animation-play-state:paused}
#intro{position:fixed;inset:0;z-index:20;background:linear-gradient(#070a22,#2a1540 70%,#5a2a3c);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);transition:opacity 1s ease,transform 1.2s ease}
#intro.out{opacity:0;transform:scale(1.6);pointer-events:none}
.saloon{width:min(92vw,360px)}
.roof{background:#5a2f17;border:4px solid #2e170a;border-radius:6px 6px 0 0;padding:14px 8px 10px;box-shadow:0 0 30px rgba(244,194,77,.25)}
.neon{font-family:Rye,Georgia,serif;font-size:1.8rem;color:var(--gold);text-shadow:0 0 8px var(--gold),0 0 22px #e2724a;animation:flick 3.2s infinite}
.neon small{display:block;margin-top:4px;font-family:Quicksand,system-ui,sans-serif;font-size:.85rem;color:var(--sand);text-shadow:none}
@keyframes flick{0%,100%,45%,49%,53%{opacity:1}47%{opacity:.3}51%{opacity:.55}}
.wall{position:relative;height:250px;background:#7a4a28;border:4px solid #2e170a;border-top:0;display:flex;justify-content:center;align-items:flex-end}
.win{position:absolute;top:34px;width:54px;height:64px;background:var(--gold);border:4px solid #2e170a;box-shadow:0 0 20px rgba(244,194,77,.7);animation:lamp 2.4s ease-in-out infinite alternate}
@keyframes lamp{from{opacity:.7}to{opacity:1}}
.doors{position:relative;width:150px;height:140px;padding:0;background:linear-gradient(#ffe7a8,#e9a640);border:4px solid #2e170a;border-bottom:0;cursor:pointer;perspective:600px}
.dl,.dr{position:absolute;top:24px;width:50%;height:74px;background:#8a4b2a;border:3px solid #2e170a;transition:transform 1s ease}
.dl{left:0;transform-origin:left center;animation:swl 2.6s ease-in-out infinite alternate}
.dr{right:0;transform-origin:right center;animation:swr 2.6s ease-in-out infinite alternate}
@keyframes swl{from{transform:rotateY(-6deg)}to{transform:rotateY(8deg)}}
@keyframes swr{from{transform:rotateY(6deg)}to{transform:rotateY(-8deg)}}
.go .dl{animation:none;transform:rotateY(-105deg)}
.go .dr{animation:none;transform:rotateY(105deg)}
.note{position:absolute;left:50%;bottom:140px;font-size:1.5rem;opacity:0;animation:note 3.5s ease-out infinite}
@keyframes note{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),-110px)}}
.tap{margin:18px 0 0;color:var(--sand);font-weight:700;animation:bob 1.8s ease-in-out infinite}
.saloon{position:relative;width:min(94vw,380px)}
.cornice{height:30px;margin:0 6px;background:#4a2410;clip-path:polygon(0 100%,0 45%,9% 45%,9% 15%,30% 15%,30% 0,70% 0,70% 15%,91% 15%,91% 45%,100% 45%,100% 100%)}
.sign{position:relative;margin:0 6px;padding:10px 8px 8px;background:#2a1409;border:3px solid #e9a640;box-shadow:0 0 26px rgba(233,166,64,.45)}
.sign .gt{position:absolute;top:12px;left:8px;font-size:1.5rem;animation:bob 2s ease-in-out infinite}
.sign .gt.r{left:auto;right:8px;animation-delay:.5s}
.neon{font-size:2.1rem}
.sign small{display:block;margin-top:2px;font-family:Quicksand,system-ui,sans-serif;font-size:.8rem;color:var(--sand)}
.awning{height:26px;margin:0 -8px;background:repeating-linear-gradient(90deg,#b5462b 0 28px,#f6e3b4 28px 56px);clip-path:polygon(3% 0,97% 0,100% 100%,0 100%)}
.bulbs{position:relative;z-index:1;display:flex;justify-content:space-around;margin:-4px 6px 0}
.bulbs i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:bulb 1.2s ease-in-out infinite alternate}
.bulbs i:nth-child(even){background:#ff8a5c;box-shadow:0 0 10px #ff8a5c;animation-delay:.6s}
@keyframes bulb{from{opacity:.3}to{opacity:1}}
.wall{height:230px;margin:0 6px;background:repeating-linear-gradient(90deg,#7a4a28 0 22px,#65391d 22px 24px);border-width:3px;border-top:0}
.hang{position:absolute;top:-2px;right:12px;z-index:2;background:var(--sand);color:#3a2010;font-family:Rye,Georgia,serif;font-size:.62rem;padding:4px 6px;border:2px solid #2e170a;transform-origin:50% -8px;animation:sway2 3s ease-in-out infinite alternate}
@keyframes sway2{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.win{top:46px;width:62px;height:78px;background:linear-gradient(#ffe7a8,#e9a640);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.win::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 47%,#2e170a 47% 53%,transparent 53%),linear-gradient(transparent 47%,#2e170a 47% 53%,transparent 53%)}
.win b{font-size:2rem;filter:brightness(0);animation:dance .8s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-12deg)}to{transform:rotate(12deg) translateY(-6px)}}
.dl,.dr{background:repeating-linear-gradient(90deg,#8a4b2a 0 8px,#6b3a1d 8px 10px)}
.walk{height:16px;margin:0 -8px;background:repeating-linear-gradient(90deg,#5b3318 0 30px,#3e220f 30px 32px);border-top:3px solid #2e170a}
.brl{position:absolute;left:6px;bottom:2px;font-size:1.9rem}
.hz{position:absolute;right:6px;bottom:0;font-size:2.2rem;transform:scaleX(-1);animation:nod 2.4s ease-in-out infinite alternate}
@keyframes nod{to{transform:scaleX(-1) translateY(-3px)}}
.home{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:4;background:rgba(27,26,69,.88);color:var(--gold);border:2px solid var(--gold);border-radius:20px;font:inherit;font-weight:700;font-size:.85rem;padding:8px 12px;cursor:pointer}
.home:active{transform:scale(.95)}
.mu{left:auto;right:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sh,.ff,.weed,.note{display:none}}
</style>
</head>

 [18,22,"Cada estrella tiene su lugar, y tú tienes el tuyo."],
 [50,12,"Tu risa ilumina más que cualquier luz del pueblo."],
 [82,24,"Eres valiente, incluso en los días en que no lo sientes."],
 [30,50,"Dios no se equivocó contigo: te hizo con cuidado."],
 [68,48,"Hay personas que hacen más bonito el camino. Tú eres una."],
 [14,78,"No tienes que ser perfecta para ser querida."],
 [52,76,"Tu corazón noble es un regalo para quienes te rodean."],
 [86,80,"Y si alguna noche olvidas tu brillo, aquí estoy para recordártelo."]];
const abre=[
 ["Cuando tengas un día pesado en la oficina","Respira hondo. Ya superaste días difíciles antes, y este también va a pasar. Tómate un café y recuerda que no estás sola."],
 ["Cuando dudes de ti","Lo que otros digan no define quién eres. Eres capaz, eres valiosa y estás creciendo más de lo que notas."],
 ["Cuando necesites sonreír","Pon tu canción favorita y baila aunque nadie te vea. Acuérdate de todas las veces que hiciste reír a los demás."],
 ["Cuando te sientas lejos de todos","Hay alguien que se alegra de que existas. Un mensaje tuyo siempre será bienvenido."]];
const V={
carta:()=>`<h2>La carta del sheriff</h2><button class="env" id="env">💌<br><small>Toca el sobre para abrirlo</small></button><div class="letter" id="let" hidden><p>Mi niña hermosa.</p><p>Quiero decirte lo mucho que te quiero y hice esto para que puedas disfrutarlo.</p><p>Gracias por estar conmigo y gracias por escucharme las veces en las que me he sentido estresado, preocupado por las distintas situaciones que he pasado. Quiero que sepas que estoy para ti en lo que necesites; gracias por tu confianza y por pasar buenos momentos hablando.</p><p>Y quiero que sepas que siempre contarás conmigo. Te quiero mucho, y con esto quiero que sepas lo muy valiosa que eres, lo hermosa que eres, lo inteligente y lo importante que eres para mí. Espero que cada uno de los rincones de este detalle te guste.</p><p>Te quiero mucho, mi niña hermosa.</p></div>`,
cielo:()=>`<h2>Cielo de estrellas</h2><div class="sky">${sky.map((s,i)=>`<button class="st" data-i="${i}" style="left:${s[0]}%;top:${s[1]}%" aria-label="Estrella ${i+1}">⭐</button>`).join("")}</div><p id="ph" class="hint">Toca las estrellas, cada una guarda un mensaje.</p>`,
abre:()=>`<h2>Abre cuando…</h2>${abre.map(a=>`<button class="fl"><b>${a[0]}</b><i>${a[1]}</i></button>`).join("")}`,
